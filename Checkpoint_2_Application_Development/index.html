<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Atores e Atrizes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Galeria de Atores e Atrizes</h1>
        <p>Encontre seus atores e atrizes favoritos!</p>
    </header>

    <main>
        <div class="pesquisa">
            <label for="busca">Buscar pelo nome:</label>
            <input type="text" id="busca" placeholder="Digite o nome de um ator ou atriz..." oninput="filtrarAtores()">
            <p id="quantidade"></p>
        </div>

        <div class="galeria" id="galeria"></div>
    </main>

    <script src="dados.js"></script>
    <script src="script.js"></script>
</body>
</html>
